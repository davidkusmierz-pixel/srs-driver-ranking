name: Update SRS Driver Ranking

on:
  schedule:
    # Niedziela, 20:00 czasu polskiego (obecnie czas letni)
    - cron: "0 18 * * 0"

  # Możliwość ręcznego uruchomienia
  workflow_dispatch:

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          pip install -r requirements.txt

      - name: Aktualizuj ranking Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python main.py
