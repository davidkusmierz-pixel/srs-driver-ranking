name: Aktualizacja Rankingu SRS

on:
  workflow_dispatch:

  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie plików
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ustawienie Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Aktualizacja rankingu
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python main.py

      - name: Sprawdzenie zapisanych ID
        run: |
          echo "ZAWARTOŚĆ message_ids.txt:"
          cat message_ids.txt || true

          echo ""
          echo "STATUS GIT:"
          git status

      - name: Zapisanie zmian
        run: |
          git config --global user.name "SRS Ranking Bot"
          git config --global user.email "ranking@srs.local"

          git add -f message_ids.txt
          git add -f ranking.json

          git status

          git commit -m "Aktualizacja rankingu SRS" || echo "Brak nowych zmian"

          git push
