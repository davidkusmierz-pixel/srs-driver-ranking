name: Aktualizacja Rankingu SRS

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 0"

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom aktualizację rankingu
        run: |
          python main.py

      - name: Zapisz ranking do GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ranking.json

          if git diff --cached --quiet; then
            echo "Brak zmian w rankingu"
          else
            git commit -m "Automatyczna aktualizacja rankingu"
            git push
          fi

      - name: Wyślij aktualizację na Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "username": "SRS Ranking",
            "content": "🏆 **SRS DRIVER RANKING**\n📊 Ranking został automatycznie zaktualizowany!\n🔗 https://dawidkusmierz-pixel.github.io/srs-driver-ranking/"
          }' \
          "$DISCORD_WEBHOOK"
