name: Aktualizacja Rankingu SRS

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 0"

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie plików
        uses: actions/checkout@v4

      - name: Instalacja Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt

      - name: Aktualizacja rankingu
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Zapisanie ID wiadomości
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add message_ids.txt

          git diff --cached --quiet || git commit -m "Aktualizacja ID rankingu"

          git push
