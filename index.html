<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRS – Losowanie Torów</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 92%;
    max-width: 700px;
    text-align: center;
    padding: 30px 15px 50px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.slot {
    background: #1b1b1b;
    border: 2px solid #333;
    border-radius: 18px;
    padding: 35px 20px;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}

#trackName {
    font-size: 30px;
    font-weight: bold;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.result {
    min-height: 45px;
    margin-top: 20px;
    font-size: 19px;
    font-weight: bold;
}

.stats {
    margin-top: 30px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 20px;
    text-align: left;
}

.stats h2 {
    text-align: center;
    margin-top: 0;
}

.trackStat {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 11px 5px;
    border-bottom: 1px solid #333;
}

.trackStat:last-child {
    border-bottom: none;
}

@media (max-width: 500px) {
    #trackName {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🏁 SRS LOSOWANIE TORU</h1>

    <div class="subtitle">
        SIM RACING SQUAD 🎲
    </div>

    <div class="slot">
        <div id="trackName">
            🎲 GOTOWY DO LOSOWANIA?
        </div>
    </div>

    <button id="drawButton">
        🎲 LOSUJ TOR
    </button>

    <div class="result" id="result"></div>

    <div class="stats">
        <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>
        <div id="ranking">
            ⏳ Ładowanie wyników...
        </div>
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =====================
   FIREBASE
===================== */

const firebaseConfig = {
    apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
    authDomain: "srs-losowanie.firebaseapp.com",
    databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
    projectId: "srs-losowanie",
    storageBucket: "srs-losowanie.firebasestorage.app",
    messagingSenderId: "212959687651",
    appId: "1:212959687651:web:0a9a5e647450767bc026d6"
};

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);


/* =====================
   LISTA TORÓW
===================== */

const tracks = [
    "Trial Mountain Circuit",
    "Deep Forest Raceway",
    "Dragon Trail – Seaside",
    "Red Bull Ring",
    "Suzuka Circuit",
    "Spa-Francorchamps",
    "Autodromo Nazionale Monza",
    "Mount Panorama",
    "Watkins Glen",
    "Nürburgring GP"
];


/* =====================
   ELEMENTY
===================== */

const button =
    document.getElementById("drawButton");

const trackName =
    document.getElementById("trackName");

const result =
    document.getElementById("result");

const ranking =
    document.getElementById("ranking");


/* =====================
   JEDEN UDZIAŁ
===================== */

const alreadyVoted =
    localStorage.getItem("srsAlreadyVoted") === "true";


function checkVoteStatus() {

    if (alreadyVoted) {

        button.disabled = true;

        button.innerHTML =
            "✅ JUŻ WZIĄŁEŚ UDZIAŁ";

        result.innerHTML =
            "🏁 Możesz losować tylko raz.";

    }

}


/* =====================
   WSPÓLNY RANKING
===================== */

const statsRef =
    ref(database, "trackStats");


onValue(statsRef, (snapshot) => {

    const stats =
        snapshot.val() || {};

    const sortedTracks =
        [...tracks].sort((a, b) => {

            return (stats[b] || 0)
                - (stats[a] || 0);

        });


    ranking.innerHTML = "";


    sortedTracks.forEach(
        (track, index) => {

            let medal = "";

            if (index === 0) {
                medal = "🥇";
            }

            else if (index === 1) {
                medal = "🥈";
            }

            else if (index === 2) {
                medal = "🥉";
            }


            ranking.innerHTML += `

                <div class="trackStat">

                    <span>
                        ${medal} 🏁 ${track}
                    </span>

                    <strong>
                        ${stats[track] || 0}×
                    </strong>

                </div>

            `;

        }
    );

});


/* =====================
   LOSOWANIE
===================== */

function drawTrack() {

    if (
        localStorage.getItem(
            "srsAlreadyVoted"
        ) === "true"
    ) {
        return;
    }


    button.disabled = true;


    result.innerHTML =
        "🎰 TRWA LOSOWANIE...";


    let counter = 0;

    let speed = 60;


    function spin() {

        const randomTrack =
            tracks[
                Math.floor(
                    Math.random()
                    * tracks.length
                )
            ];


        trackName.innerHTML =
            "🏁 " + randomTrack;


        counter++;


        if (counter < 35) {

            speed += 10;

            setTimeout(
                spin,
                speed
            );

        }

        else {

            const winner =
                tracks[
                    Math.floor(
                        Math.random()
                        * tracks.length
                    )
                ];


            trackName.innerHTML =
                "🏆 " + winner;


            result.innerHTML =
                "🎉 TWÓJ WYLOSOWANY TOR!";


            /* ZAPIS DO WSPÓLNEJ BAZY */

            const winnerRef =
                ref(
                    database,
                    "trackStats/" + winner
                );


            runTransaction(
                winnerRef,
                (currentValue) => {

                    return (
                        currentValue || 0
                    ) + 1;

                }
            );


            /* BLOKADA UŻYTKOWNIKA */

            localStorage.setItem(
                "srsAlreadyVoted",
                "true"
            );


            button.innerHTML =
                "✅ JUŻ WZIĄŁEŚ UDZIAŁ";


            button.disabled = true;

        }

    }


    spin();

}


/* =====================
   START
===================== */

button.addEventListener(
    "click",
    drawTrack
);


checkVoteStatus();

</script>

</body>
</html>
