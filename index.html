<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111214;
      color: #ffffff;
      padding: 30px 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #bdbdbd;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .card {
      background: #202124;
      border: 2px solid #393b40;
      border-radius: 20px;
      min-height: 160px;
      padding: 30px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-bottom: 20px;
    }

    #trackName {
      font-size: 30px;
      font-weight: bold;
    }

    #drawButton {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #111111;
      transition: 0.2s;
    }

    #drawButton:hover {
      transform: scale(1.02);
    }

    #drawButton:active {
      transform: scale(0.98);
    }

    #drawButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 17px;
    }

    .ranking {
      background: #202124;
      border: 2px solid #393b40;
      border-radius: 20px;
      padding: 25px;
    }

    .ranking h2 {
      margin: 0 0 20px;
      text-align: center;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 5px;
      border-bottom: 1px solid #393b40;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .track-info {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .position {
      min-width: 35px;
      font-weight: bold;
    }

    .count {
      font-size: 18px;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      body {
        padding: 20px 10px;
      }

      h1 {
        font-size: 25px;
      }

      #trackName {
        font-size: 22px;
      }

      .ranking {
        padding: 18px;
      }

      .ranking-item {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🏁 SRS LOSOWANIE TORU</h1>
      <div class="subtitle">SIM RACING SQUAD 🎲</div>
    </div>

    <div class="card">
      <div id="trackName">
        🎲 KLIKNIJ LOSUJ TOR
      </div>
    </div>

    <button id="drawButton" type="button">
      🎲 LOSUJ TOR
    </button>

    <div id="message"></div>

    <div class="ranking">
      <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>
      <div id="rankingList"></div>
    </div>

  </div>


  <script type="module">

    /* =========================================
       🔥 FIREBASE
    ========================================== */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
      authDomain: "srs-losowanie.firebaseapp.com",
      databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
      projectId: "srs-losowanie",
      storageBucket: "srs-losowanie.firebasestorage.app",
      messagingSenderId: "212959687651",
      appId: "1:212959687651:web:0a9a5e647450767bc026d6",
      measurementId: "G-HGT81Y72HF"
    };


    const app =
      initializeApp(firebaseConfig);

    const database =
      getDatabase(app);


    /* =========================================
       🏁 GRAN TURISMO 7 – LISTA TORÓW
    ========================================== */

    const tracks = [

      "Alsace – Village",

      "Autodrome Lago Maggiore – East",
      "Autodrome Lago Maggiore – East Reverse",
      "Autodrome Lago Maggiore – East End",
      "Autodrome Lago Maggiore – East End Reverse",
      "Autodrome Lago Maggiore – West",
      "Autodrome Lago Maggiore – West Reverse",
      "Autodrome Lago Maggiore – West End",
      "Autodrome Lago Maggiore – West End Reverse",

      "Autopolis – Full Course",
      "Autopolis – Shortcut Course",

      "Blue Moon Bay Speedway",
      "Blue Moon Bay Speedway Reverse",
      "Blue Moon Bay – Infield A",
      "Blue Moon Bay – Infield A Reverse",
      "Blue Moon Bay – Infield B",
      "Blue Moon Bay – Infield B Reverse",

      "Brands Hatch – GP Circuit",
      "Brands Hatch – Indy Circuit",

      "Broad Bean Raceway",
      "Broad Bean Raceway Reverse",

      "Circuit de Barcelona-Catalunya – GP",
      "Circuit de Barcelona-Catalunya – GP No Chicane",
      "Circuit de Barcelona-Catalunya – National",
      "Circuit de Barcelona-Catalunya – Rallycross",

      "Circuit de Sainte-Croix – A",
      "Circuit de Sainte-Croix – A Reverse",
      "Circuit de Sainte-Croix – B",
      "Circuit de Sainte-Croix – B Reverse",
      "Circuit de Sainte-Croix – C",
      "Circuit de Sainte-Croix – C Reverse",

      "Circuit de Spa-Francorchamps",
      "Circuit Gilles-Villeneuve",

      "Colorado Springs – Lake",
      "Colorado Springs – Lake Reverse",

      "Daytona International Speedway – Tri-Oval",
      "Daytona International Speedway – Road Course",

      "Deep Forest Raceway",
      "Deep Forest Raceway Reverse",

      "Dragon Trail – Seaside",
      "Dragon Trail – Seaside Reverse",
      "Dragon Trail – Gardens",
      "Dragon Trail – Gardens Reverse",

      "Eiger Nordwand",
      "Eiger Nordwand Reverse",

      "Fisherman's Ranch",

      "Fuji International Speedway",

      "Grand Valley – South",

      "High Speed Ring",

      "Kyoto Driving Park – Miyabi",
      "Kyoto Driving Park – Yamagiwa",
      "Kyoto Driving Park – Yamagiwa Reverse",
      "Kyoto Driving Park – Yamagiwa + Miyabi",
      "Kyoto Driving Park – Yamagiwa + Miyabi Reverse",

      "Lake Louise – Long Track",
      "Lake Louise – Long Track Reverse",
      "Lake Louise – Short Track",
      "Lake Louise – Short Track Reverse",
      "Lake Louise – Tri-Oval",
      "Lake Louise – Tri-Oval Reverse",

      "Michelin Raceway Road Atlanta",

      "Autodromo Nazionale Monza – No Chicane",

      "Mount Panorama Motor Racing Circuit",

      "Nürburgring – Nordschleife Tourist",

      "Nürburgring – Endurance II",
      "Nürburgring – Sprint",

      "Northern Isle Speedway",

      "Red Bull Ring",
      "Red Bull Ring Reverse",

      "Sardegna – Road Track A",
      "Sardegna – Road Track A Reverse",

      "Sardegna – Road Track B Reverse",
      "Sardegna – Road Track C",
      "Sardegna – Road Track C Reverse",

      "Sardegna – Windmills",
      "Sardegna – Windmills Reverse",

      "Special Stage Route X",

      "Suzuka Circuit",
      "Suzuka Circuit – East",
      "Suzuka Circuit – East Reverse",

      "Tokyo Expressway – Central Clockwise",
      "Tokyo Expressway – Central Counterclockwise",
      "Tokyo Expressway – East Clockwise",
      "Tokyo Expressway – East Counterclockwise",
      "Tokyo Expressway – South Clockwise",
      "Tokyo Expressway – South Counterclockwise",

      "Trial Mountain Circuit",
      "Trial Mountain Circuit Reverse",

      "Tsukuba Circuit",

      "Watkins Glen – Long Course",
      "Watkins Glen – Short Course",

      "WeatherTech Raceway Laguna Seca",

      "Willow Springs – Big Willow",
      "Willow Springs – Horse Thief Mile",
      "Willow Springs – Horse Thief Mile Reverse",
      "Willow Springs – Streets of Willow Springs",
      "Willow Springs – Streets of Willow Springs Reverse",

      "Yas Marina Circuit – Full Circuit",
      "Yas Marina Circuit – Short Circuit"

    ];


    /* =========================================
       🔗 ELEMENTY STRONY
    ========================================== */

    const button =
      document.getElementById("drawButton");

    const trackName =
      document.getElementById("trackName");

    const message =
      document.getElementById("message");

    const rankingList =
      document.getElementById("rankingList");


    /* =========================================
       🏆 WYŚWIETLANIE RANKINGU
    ========================================== */

    function renderRanking(ranking) {

      const sortedTracks =
        tracks
          .map(function(track) {

            return {
              name: track,
              count: ranking[track] || 0
            };

          })

          .sort(function(a, b) {

            if (b.count !== a.count) {
              return b.count - a.count;
            }

            return tracks.indexOf(a.name) -
                   tracks.indexOf(b.name);

          });


      rankingList.innerHTML = "";


      sortedTracks.forEach(
        function(track, index) {

          const row =
            document.createElement("div");

          row.className =
            "ranking-item";


          let position =
            (index + 1) + ".";


          if (index === 0) {
            position = "🥇";
          }

          else if (index === 1) {
            position = "🥈";
          }

          else if (index === 2) {
            position = "🥉";
          }


          row.innerHTML =
            '<div class="track-info">' +
              '<span class="position">' +
                position +
              '</span>' +
              '<span>🏁 ' +
                track.name +
              '</span>' +
            '</div>' +
            '<strong class="count">' +
              track.count +
              '×</strong>';


          rankingList.appendChild(row);

        }
      );

    }


    /* =========================================
       🔥 ODBIERANIE RANKINGU Z FIREBASE
    ========================================== */

    const rankingRef =
      ref(database, "srsTrackRanking");


    onValue(
      rankingRef,
      function(snapshot) {

        const ranking =
          snapshot.val() || {};

        renderRanking(ranking);

      }
    );


    /* =========================================
       🎲 LOSOWANIE TORU
    ========================================== */

    function drawTrack() {

      button.disabled = true;


      message.textContent =
        "🎲 LOSOWANIE TORU...";


      let animationCount = 0;


      const animation =
        setInterval(function() {

          const randomTrack =
            tracks[
              Math.floor(
                Math.random() *
                tracks.length
              )
            ];


          trackName.textContent =
            "🎲 " + randomTrack;


          animationCount++;

        }, 100);


      setTimeout(function() {

        clearInterval(animation);


        const selectedTrack =
          tracks[
            Math.floor(
              Math.random() *
              tracks.length
            )
          ];


        trackName.textContent =
          "🏆 " + selectedTrack;


        message.textContent =
          "🎉 TOR ZOSTAŁ WYLOSOWANY!";


        const trackRef =
          ref(
            database,
            "srsTrackRanking/" +
            encodeURIComponent(selectedTrack)
          );


        runTransaction(
          trackRef,
          function(currentValue) {

            return (
              currentValue || 0
            ) + 1;

          }
        )


        .then(function() {

          button.disabled = false;

        })


        .catch(function(error) {

          console.error(error);


          message.textContent =
            "❌ BŁĄD ZAPISU LOSOWANIA!";


          button.disabled = false;

        });

      }, 2500);

    }


    /* =========================================
       🖱️ PRZYCISK
    ========================================== */

    button.addEventListener(
      "click",
      drawTrack
    );

  </script>

</body>
</html>
