<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRS – Losowanie Torów</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 92%;
    max-width: 700px;
    text-align: center;
    padding: 30px 15px 50px;
}

h1 {
    margin-bottom: 5px;
    font-size: 32px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.slot {
    background: #1b1b1b;
    border: 2px solid #333;
    border-radius: 18px;
    padding: 35px 20px;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}

#trackName {
    font-size: 30px;
    font-weight: bold;
}

.mainButton,
.discordButton {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

.mainButton {
    background: white;
    color: black;
}

.discordButton {
    display: none;
    background: #5865F2;
    color: white;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.result {
    min-height: 45px;
    margin: 20px 0 10px;
    font-size: 20px;
    font-weight: bold;
}

.stats,
.history {
    margin-top: 25px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 20px;
    text-align: left;
}

.stats h2,
.history h2 {
    text-align: center;
    margin-top: 0;
}

.trackStat,
.historyItem {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 5px;
    border-bottom: 1px solid #333;
}

.trackStat:last-child,
.historyItem:last-child {
    border-bottom: none;
}

.medal {
    margin-right: 5px;
}

@media (max-width: 500px) {
    h1 {
        font-size: 26px;
    }

    #trackName {
        font-size: 23px;
    }

    .trackStat,
    .historyItem {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🏁 SRS LOSOWANIE TORU</h1>

    <div class="subtitle">
        SIM RACING SQUAD 🎲
    </div>

    <div class="slot">
        <div id="trackName">
            🎲 GOTOWY DO LOSOWANIA?
        </div>
    </div>

    <button
        class="mainButton"
        id="drawButton"
        onclick="drawTrack()"
    >
        🎲 LOSUJ TOR
    </button>

    <div
        class="result"
        id="result"
    ></div>

    <button
        class="discordButton"
        id="discordButton"
        onclick="sendToDiscord()"
    >
        📢 WYŚLIJ WYNIK NA DISCORD
    </button>

    <div class="history">

        <h2>📜 OSTATNIE LOSOWANIA</h2>

        <div id="history">
            Brak losowań
        </div>

    </div>

    <div class="stats">

        <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>

        <div id="ranking"></div>

    </div>

</div>

<script>

const tracks = [
    "Trial Mountain Circuit",
    "Deep Forest Raceway",
    "Dragon Trail – Seaside",
    "Red Bull Ring",
    "Suzuka Circuit",
    "Spa-Francorchamps",
    "Autodromo Nazionale Monza",
    "Mount Panorama",
    "Watkins Glen",
    "Nürburgring GP"
];


/* =========================
   STATYSTYKI
========================= */

let stats = JSON.parse(
    localStorage.getItem("srsTrackStats")
) || {};


tracks.forEach(track => {

    if (stats[track] === undefined) {
        stats[track] = 0;
    }

});


/* =========================
   HISTORIA
========================= */

let history = JSON.parse(
    localStorage.getItem("srsTrackHistory")
) || [];


let lastWinner = null;


/* =========================
   ZAPIS
========================= */

function saveData() {

    localStorage.setItem(
        "srsTrackStats",
        JSON.stringify(stats)
    );

    localStorage.setItem(
        "srsTrackHistory",
        JSON.stringify(history)
    );

}


/* =========================
   RANKING
========================= */

function showRanking() {

    const ranking =
        document.getElementById("ranking");

    const sortedTracks =
        [...tracks].sort(
            (a, b) => stats[b] - stats[a]
        );

    ranking.innerHTML = "";

    sortedTracks.forEach(
        (track, index) => {

            let medal = "";

            if (index === 0) {
                medal = "🥇";
            }

            else if (index === 1) {
                medal = "🥈";
            }

            else if (index === 2) {
                medal = "🥉";
            }

            ranking.innerHTML += `

                <div class="trackStat">

                    <span>
                        ${medal} 🏁 ${track}
                    </span>

                    <strong>
                        ${stats[track]}
                    </strong>

                </div>

            `;

        }
    );

}


/* =========================
   HISTORIA LOSOWAŃ
========================= */

function showHistory() {

    const historyBox =
        document.getElementById("history");

    if (history.length === 0) {

        historyBox.innerHTML =
            "🎲 Brak losowań";

        return;

    }

    historyBox.innerHTML = "";

    history.slice(0, 10)
        .forEach((item, index) => {

            historyBox.innerHTML += `

                <div class="historyItem">

                    <span>
                        ${index + 1}. 🏁 ${item}
                    </span>

                </div>

            `;

        });

}


/* =========================
   LOSOWANIE
========================= */

function drawTrack() {

    const button =
        document.getElementById("drawButton");

    const trackName =
        document.getElementById("trackName");

    const result =
        document.getElementById("result");

    const discordButton =
        document.getElementById("discordButton");


    button.disabled = true;

    discordButton.style.display =
        "none";


    result.innerHTML =
        "🎰 TRWA LOSOWANIE...";


    let counter = 0;

    let speed = 60;


    function spin() {

        const randomTrack =
            tracks[
                Math.floor(
                    Math.random()
                    * tracks.length
                )
            ];


        trackName.innerHTML =
            "🏁 " + randomTrack;


        counter++;


        if (counter < 35) {

            speed += 10;

            setTimeout(
                spin,
                speed
            );

        }

        else {

            const winner =
                tracks[
                    Math.floor(
                        Math.random()
                        * tracks.length
                    )
                ];


            lastWinner =
                winner;


            trackName.innerHTML =
                "🏆 " + winner;


            result.innerHTML =
                "🎉 WYLOSOWANY TOR! 🎉";


            /* Dodaj punkt */

            stats[winner]++;


            /* Dodaj do historii */

            history.unshift(
                winner
            );


            /* Maksymalnie 10 */

            if (history.length > 10) {

                history.pop();

            }


            saveData();


            showRanking();

            showHistory();


            button.disabled =
                false;


            discordButton.style.display =
                "block";

        }

    }

    spin();

}


/* =========================
   DISCORD
========================= */

function sendToDiscord() {

    if (!lastWinner) {

        return;

    }

    const sortedTracks =
        [...tracks].sort(
            (a, b) => stats[b] - stats[a]
        );


    const mostPopular =
        sortedTracks[0];


    alert(
        "📢 Wynik gotowy do wysłania na Discord!\n\n"
        +
        "🏆 Wylosowany tor: "
        +
        lastWinner
        +
        "\n📊 Liczba losowań: "
        +
        stats[lastWinner]
        +
        "\n🥇 Najczęściej losowany: "
        +
        mostPopular
    );

}


/* =========================
   START
========================= */

showRanking();

showHistory();

</script>

</body>
</html>
