<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOSOWANIE TORU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111214;
      color: #ffffff;
      padding: 30px 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #bdbdbd;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .card {
      background: #202124;
      border: 2px solid #393b40;
      border-radius: 20px;
      min-height: 160px;
      padding: 30px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-bottom: 20px;
    }

    #trackName {
      font-size: 30px;
      font-weight: bold;
      line-height: 1.3;
    }

    #drawButton {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #111111;
      transition: 0.2s;
    }

    #drawButton:hover {
      transform: scale(1.02);
    }

    #drawButton:active {
      transform: scale(0.98);
    }

    #drawButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 17px;
    }

    .ranking {
      background: #202124;
      border: 2px solid #393b40;
      border-radius: 20px;
      padding: 25px;
      margin-top: 10px;
    }

    .ranking h2 {
      margin: 0 0 20px;
      text-align: center;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 5px;
      border-bottom: 1px solid #393b40;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .track-info {
      display: flex;
      gap: 10px;
      align-items: center;
      text-align: left;
    }

    .position {
      min-width: 35px;
      font-size: 20px;
    }

    .count {
      font-size: 18px;
      white-space: nowrap;
    }

    .empty-ranking {
      text-align: center;
      color: #bdbdbd;
      padding: 15px 0;
    }

    @media (max-width: 500px) {
      body {
        padding: 20px 10px;
      }

      h1 {
        font-size: 25px;
      }

      #trackName {
        font-size: 22px;
      }

      .ranking {
        padding: 18px;
      }

      .ranking-item {
        font-size: 14px;
      }

      #drawButton {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🏁 SRS LOSOWANIE TORU</h1>
      <div class="subtitle">SIM RACING SQUAD 🎲</div>
    </div>

    <div class="card">
      <div id="trackName">
        🎲 KLIKNIJ LOSUJ TOR
      </div>
    </div>

    <button id="drawButton" type="button">
      🎲 LOSUJ TOR
    </button>

    <div id="message"></div>

    <div class="ranking">
      <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>
      <div id="rankingList"></div>
    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
      authDomain: "srs-losowanie.firebaseapp.com",
      databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
      projectId: "srs-losowanie",
      storageBucket: "srs-losowanie.firebasestorage.app",
      messagingSenderId: "212959687651",
      appId: "1:212959687651:web:0a9a5e647450767bc026d6"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    const tracks = [
      "24 Heures du Mans Racing Circuit",
      "24 Heures du Mans Racing Circuit – No Chicane",
      "Alsace – Village",
      "Autódromo de Interlagos",
      "Autodrome Lago Maggiore – Full Course",
      "Autopolis – Full Course",
      "Blue Moon Bay Speedway",
      "Brands Hatch – GP Circuit",
      "Brands Hatch – Indy Circuit",
      "Broad Bean Raceway",
      "Circuit de Barcelona-Catalunya – GP",
      "Circuit de Sainte-Croix – A",
      "Circuit de Spa-Francorchamps",
      "Circuit Gilles-Villeneuve",
      "Colorado Springs – Lake",
      "Daytona International Speedway – Tri-Oval",
      "Daytona International Speedway – Road Course",
      "Deep Forest Raceway",
      "Dragon Trail – Seaside",
      "Dragon Trail – Gardens",
      "Eiger Nordwand",
      "Fisherman's Ranch",
      "Fuji International Speedway",
      "Goodwood Motor Circuit",
      "Grand Valley – Highway 1",
      "Grand Valley – South",
      "High Speed Ring",
      "Kyoto Driving Park – Miyabi",
      "Kyoto Driving Park – Yamagiwa",
      "Kyoto Driving Park – Yamagiwa + Miyabi",
      "Lake Louise – Long Track",
      "Lake Louise – Short Track",
      "Michelin Raceway Road Atlanta",
      "Autodromo Nazionale Monza",
      "Mount Panorama Motor Racing Circuit",
      "Nürburgring – GP",
      "Nürburgring – Nordschleife",
      "Nürburgring – Endurance",
      "Northern Isle Speedway",
      "Red Bull Ring",
      "Sardegna – Road Track A",
      "Sardegna – Road Track B",
      "Sardegna – Road Track C",
      "Sardegna – Windmills",
      "Special Stage Route X",
      "Suzuka Circuit",
      "Tokyo Expressway – Central Clockwise",
      "Tokyo Expressway – Central Counterclockwise",
      "Tokyo Expressway – East Clockwise",
      "Tokyo Expressway – East Counterclockwise",
      "Tokyo Expressway – South Clockwise",
      "Tokyo Expressway – South Counterclockwise",
      "Trial Mountain Circuit",
      "Tsukuba Circuit",
      "Watkins Glen – Long Course",
      "Watkins Glen – Short Course",
      "WeatherTech Raceway Laguna Seca",
      "Willow Springs – Big Willow",
      "Yas Marina Circuit – Full Circuit",
      "Yas Marina Circuit – Short Circuit"
    ];


    const button = document.getElementById("drawButton");
    const trackName = document.getElementById("trackName");
    const message = document.getElementById("message");
    const rankingList = document.getElementById("rankingList");


    function getTrackId(track) {
      return "track_" +
        btoa(unescape(encodeURIComponent(track)))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
    }


    function renderRanking(ranking) {

      const sortedTracks = tracks
        .map(function(track) {
          return {
            name: track,
            count: ranking[getTrackId(track)] || 0
          };
        })
        .filter(function(track) {
          return track.count > 0;
        })
        .sort(function(a, b) {
          return b.count - a.count;
        });

      rankingList.innerHTML = "";

      if (sortedTracks.length === 0) {
        rankingList.innerHTML =
          '<div class="empty-ranking">' +
          '🎲 JESZCZE NIE WYLOSOWANO ŻADNEGO TORU' +
          '</div>';
        return;
      }

      sortedTracks.slice(0, 10).forEach(function(track, index) {

        const row = document.createElement("div");
        row.className = "ranking-item";

        let position;

        if (index === 0) {
          position = "🥇";
        } else if (index === 1) {
          position = "🥈";
        } else if (index === 2) {
          position = "🥉";
        } else {
          position = (index + 1) + ".";
        }

        row.innerHTML =
          '<div class="track-info">' +
            '<span class="position">' + position + '</span>' +
            '<span>🏁 ' + track.name + '</span>' +
          '</div>' +
          '<strong class="count">' +
            track.count + '×' +
          '</strong>';

        rankingList.appendChild(row);

      });
    }


    const rankingRef = ref(
      database,
      "srsTrackRanking"
    );


    onValue(rankingRef, function(snapshot) {

      const ranking = snapshot.val() || {};

      renderRanking(ranking);

    });


    function drawTrack() {

      button.disabled = true;

      message.textContent = "🎲 LOSOWANIE TORU...";


      const animation = setInterval(function() {

        const randomTrack =
          tracks[
            Math.floor(
              Math.random() * tracks.length
            )
          ];

        trackName.textContent =
          "🎲 " + randomTrack;

      }, 100);


      setTimeout(function() {

        clearInterval(animation);


        const selectedTrack =
          tracks[
            Math.floor(
              Math.random() * tracks.length
            )
          ];


        trackName.textContent =
          "🏆 " + selectedTrack;

        message.textContent =
          "💾 ZAPISYWANIE LOSOWANIA...";


        const trackRef = ref(
          database,
          "srsTrackRanking/" +
          getTrackId(selectedTrack)
        );


        runTransaction(
          trackRef,
          function(currentValue) {
            return (currentValue || 0) + 1;
          }
        )
        .then(function() {

          message.textContent =
            "🎉 TOR ZOSTAŁ WYLOSOWANY!";

          button.disabled = false;

        })
        .catch(function(error) {

          console.error(error);

          message.textContent =
            "❌ BŁĄD ZAPISU!";

          button.disabled = false;

        });

      }, 2500);

    }


    button.addEventListener(
      "click",
      drawTrack
    );

  </script>

</body>
</html>
