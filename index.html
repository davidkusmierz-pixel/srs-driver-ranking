<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOSOWANIE TORU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 18px 35px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
    }

    #losujBtn {
      background: #e10600;
      color: white;
    }

    #losujBtn:hover {
      transform: scale(1.03);
    }

    .wynik,
    .ranking {
      margin-top: 30px;
      padding: 25px;
      background: #222;
      border-radius: 15px;
    }

    #wylosowanyTor {
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
      color: #ff3b30;
    }

    .ranking {
      text-align: left;
    }

    .ranking h2 {
      text-align: center;
    }

    .tor {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px;
      margin: 7px 0;
      background: #333;
      border-radius: 8px;
    }

    .info {
      margin-top: 20px;
      color: #aaa;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🏁 SRS LOSOWANIE TORU</h1>

  <div class="subtitle">
    Każdy użytkownik może wylosować tor tylko jeden raz.
  </div>

  <button id="losujBtn">🎲 LOSUJ TOR</button>

  <div id="status" class="status"></div>

  <div class="wynik">
    <div>WYLOSOWANY TOR:</div>
    <div id="wylosowanyTor">
      Jeszcze nie wylosowano
    </div>
  </div>

  <div class="ranking">
    <h2>📊 WYNIKI LOSOWANIA</h2>

    <div id="ranking">
      Ładowanie wyników...
    </div>
  </div>

  <div class="info">
    👑 Administrator po wpisaniu PIN-u może losować dalej.
  </div>

</div>


<script type="module">

  /* =========================
     🔒 PIN ADMINISTRATORA
  ========================= */

  const ADMIN_PIN = "840416";


  /* =========================
     🔥 IMPORT FIREBASE
  ========================= */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    onValue,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";


  /* =========================
     🔥 FIREBASE
     WKLEJ SWOJE PRAWDZIWE DANE
  ========================= */

  const firebaseConfig = {

    apiKey: "WKLEJ_TUTAJ_SWOJ_API_KEY",

    authDomain: "WKLEJ_TUTAJ.firebaseapp.com",

    databaseURL: "WKLEJ_TUTAJ_FIREBASE_DATABASE_URL",

    projectId: "WKLEJ_TUTAJ_PROJECT_ID",

    storageBucket: "WKLEJ_TUTAJ.appspot.com",

    messagingSenderId: "WKLEJ_TUTAJ_SENDER_ID",

    appId: "WKLEJ_TUTAJ_APP_ID"

  };


  /* =========================
     ZMIENNE
  ========================= */

  let db = null;
  let adminMode = false;

  const losujBtn = document.getElementById("losujBtn");
  const wylosowanyTor = document.getElementById("wylosowanyTor");
  const ranking = document.getElementById("ranking");
  const status = document.getElementById("status");


  /* =========================
     🏁 LISTA TORÓW
  ========================= */

  const tory = [

    "Alsace Village",
    "Autodrome Lago Maggiore",
    "Autodromo Nazionale Monza",
    "Blue Moon Bay Speedway",
    "Brands Hatch",
    "Circuit de Barcelona-Catalunya",
    "Circuit de la Sarthe",
    "Circuit de Spa-Francorchamps",
    "Colorado Springs",
    "Daytona International Speedway",
    "Deep Forest Raceway",
    "Dragon Trail – Gardens",
    "Dragon Trail – Seaside",
    "Fishermans Ranch",
    "Fuji International Speedway",
    "Goodwood Motor Circuit",
    "High Speed Ring",
    "Interlagos",
    "Kyoto Driving Park",
    "Lake Louise",
    "Laguna Seca",
    "Mount Panorama",
    "Nürburgring",
    "Northern Isle Speedway",
    "Red Bull Ring",
    "Sardegna",
    "Special Stage Route X",
    "Suzuka Circuit",
    "Tokyo Expressway",
    "Trial Mountain Circuit",
    "Tsukuba Circuit",
    "Watkins Glen",
    "Willow Springs"
  ];


  /* =========================
     🔥 URUCHOM FIREBASE
  ========================= */

  try {

    const app = initializeApp(firebaseConfig);

    db = getDatabase(app);

    status.textContent = "🔥 Połączono z systemem losowania";

    onValue(
      ref(db, "losowanieTorow"),
      (snapshot) => {

        const dane = snapshot.val() || {};

        const posortowane = Object.entries(dane)
          .sort((a, b) => b[1] - a[1]);

        if (posortowane.length === 0) {
          ranking.innerHTML = "Brak wyników.";
          return;
        }

        ranking.innerHTML = posortowane
          .map(([tor, liczba], index) => {

            return `
              <div class="tor">
                <span>
                  ${index + 1}. ${tor}
                </span>

                <strong>
                  ${liczba} losowań
                </strong>
              </div>
            `;

          })
          .join("");

      },
      (error) => {

        console.error(error);

        ranking.innerHTML =
          "⚠️ Nie udało się pobrać wyników.";

      }
    );

  } catch (error) {

    console.error(error);

    status.textContent =
      "⚠️ Problem z połączeniem Firebase.";

    ranking.innerHTML =
      "⚠️ Wklej prawidłową konfigurację Firebase.";

  }


  /* =========================
     🔒 SPRAWDZENIE LOSOWANIA
  ========================= */

  function czyMoznaLosowac() {

    /* 👑 Admin już aktywny */

    if (adminMode) {
      return true;
    }


    /* 👤 Użytkownik jeszcze nie losował */

    if (
      localStorage.getItem("srs_juz_losowal")
      !== "tak"
    ) {
      return true;
    }


    /* 🔒 Użytkownik już losował */

    const pin = prompt(
      "🔒 Już wykorzystałeś swoje losowanie!\n\n" +
      "👑 Administrator może wpisać PIN:"
    );


    if (pin === ADMIN_PIN) {

      adminMode = true;

      alert(
        "👑 TRYB ADMINISTRATORA AKTYWNY!\n\n" +
        "Możesz teraz losować bez ograniczeń."
      );

      status.textContent =
        "👑 TRYB ADMINISTRATORA AKTYWNY";

      return true;

    }


    alert(
      "❌ Już wykorzystałeś swoje losowanie!"
    );

    return false;

  }


  /* =========================
     🎲 PRZYCISK LOSOWANIA
  ========================= */

  losujBtn.addEventListener(
    "click",
    async () => {


      /* 🔒 BLOKADA */

      if (!czyMoznaLosowac()) {
        return;
      }


      /* 🎲 LOSOWANIE */

      const tor =
        tory[
          Math.floor(
            Math.random() * tory.length
          )
        ];


      /* 🖥️ POKAŻ WYNIK */

      wylosowanyTor.textContent = tor;


      /* 🔥 JEŚLI FIREBASE NIE DZIAŁA */

      if (!db) {

        alert(
          "⚠️ Tor został wylosowany, ale wynik nie został zapisany do Firebase."
        );

        return;

      }


      try {

        losujBtn.disabled = true;

        const bezpiecznaNazwa =
          tor.replace(/[.#$[\]/]/g, "_");


        const torRef =
          ref(
            db,
            "losowanieTorow/" +
            bezpiecznaNazwa
          );


        await runTransaction(
          torRef,
          (currentValue) => {

            return (
              currentValue || 0
            ) + 1;

          }
        );


        /* 🔒 ZAPIS BLOKADY */

        if (!adminMode) {

          localStorage.setItem(
            "srs_juz_losowal",
            "tak"
          );

          status.textContent =
            "🔒 Twoje losowanie zostało wykorzystane.";

        }


      } catch (error) {

        console.error(error);

        alert(
          "❌ Błąd zapisu wyniku."
        );

      } finally {

        losujBtn.disabled = false;

      }

    }
  );

</script>

</body>
</html>
