<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS – Losowanie Toru</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #090909, #1b1b1b);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #bdbdbd;
      margin-bottom: 30px;
    }

    .draw-card {
      background: #171717;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .track-title {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 15px;
    }

    #trackName {
      font-size: 32px;
      font-weight: bold;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #111;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: scale(1.02);
    }

    button:disabled {
      background: #444;
      color: #aaa;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      font-size: 17px;
      min-height: 25px;
      color: #4ade80;
    }

    .timer-box {
      margin-top: 15px;
      color: #facc15;
      font-size: 15px;
    }

    .ranking {
      margin-top: 30px;
      background: #171717;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 25px;
      text-align: left;
    }

    .ranking h2 {
      text-align: center;
      margin-top: 0;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 5px;
      border-bottom: 1px solid #333;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏁 SRS LOSOWANIE TORU</h1>

    <div class="subtitle">
      Każdy użytkownik może losować tor raz na 5 dni.
    </div>

    <div class="draw-card">

      <div class="track-title">
        WYLOSOWANY TOR
      </div>

      <div id="trackName">
        🎲 Kliknij „LOSUJ TOR”
      </div>

      <button id="drawButton">
        🎲 LOSUJ TOR
      </button>

      <div id="message"></div>

      <div id="timer" class="timer-box"></div>

    </div>

    <div class="ranking">

      <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>

      <div id="rankingList">
        Ładowanie rankingu...
      </div>

    </div>

  </div>


  <script>

    const tracks = [
      "Trial Mountain Circuit",
      "Deep Forest Raceway",
      "Dragon Trail – Wybrzeże",
      "Red Bull Ring",
      "Suzuka Circuit",
      "Mount Panorama",
      "Laguna Seca",
      "Monza",
      "Spa-Francorchamps",
      "Watkins Glen"
    ];

    const button = document.getElementById("drawButton");
    const trackName = document.getElementById("trackName");
    const message = document.getElementById("message");
    const timer = document.getElementById("timer");
    const rankingList = document.getElementById("rankingList");


    // =========================
    // CZAS BLOKADY – 5 DNI
    // =========================

    const FIVE_DAYS = 5 * 24 * 60 * 60 * 1000;


    // =========================
    // SPRAWDZANIE CZASU
    // =========================

    function checkDrawStatus() {

      const lastDraw = localStorage.getItem("srsLastDraw");

      if (!lastDraw) {
        button.disabled = false;
        button.textContent = "🎲 LOSUJ TOR";
        timer.textContent = "";
        return;
      }

      const now = Date.now();
      const lastDrawTime = Number(lastDraw);
      const nextDrawTime = lastDrawTime + FIVE_DAYS;
      const remaining = nextDrawTime - now;

      if (remaining <= 0) {

        button.disabled = false;
        button.textContent = "🎲 LOSUJ TOR";

        timer.textContent = "🎉 Możesz ponownie wylosować tor!";
        message.textContent = "";

        localStorage.removeItem("srsLastDraw");

      } else {

        button.disabled = true;
        button.textContent = "🔒 JUŻ WZIĄŁEŚ UDZIAŁ";

        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));

        const hours = Math.floor(
          (remaining % (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );

        const minutes = Math.floor(
          (remaining % (1000 * 60 * 60)) /
          (1000 * 60)
        );

        const seconds = Math.floor(
          (remaining % (1000 * 60)) /
          1000
        );

        timer.textContent =
          `⏳ Następne losowanie za: ${days}d ${hours}g ${minutes}m ${seconds}s`;

      }

    }


    // =========================
    // LOSOWANIE
    // =========================

    button.addEventListener("click", function () {

      const randomTrack =
        tracks[Math.floor(Math.random() * tracks.length)];

      trackName.textContent = randomTrack;

      message.textContent =
        "🎉 Tor został wylosowany! Wróć za 5 dni.";

      localStorage.setItem(
        "srsLastDraw",
        Date.now()
      );

      updateRanking(randomTrack);

      checkDrawStatus();

    });


    // =========================
    // RANKING TORÓW
    // =========================

    function getRanking() {

      const savedRanking =
        JSON.parse(
          localStorage.getItem("srsTrackRanking")
        ) || {};

      return savedRanking;

    }


    function updateRanking(track) {

      const ranking = getRanking();

      if (!ranking[track]) {
        ranking[track] = 0;
      }

      ranking[track]++;

      localStorage.setItem(
        "srsTrackRanking",
        JSON.stringify(ranking)
      );

      renderRanking();

    }


    function renderRanking() {

      const ranking = getRanking();

      const sortedRanking =
        Object.entries(ranking)
          .sort((a, b) => b[1] - a[1]);

      if (sortedRanking.length === 0) {

        rankingList.innerHTML =
          "<div class='ranking-item'>Brak losowań</div>";

        return;
      }

      rankingList.innerHTML = "";

      sortedRanking.forEach((item, index) => {

        const track = item[0];
        const count = item[1];

        const div = document.createElement("div");

        div.className = "ranking-item";

        div.innerHTML = `
          <span>
            ${index + 1}. ${track}
          </span>

          <strong>
            ${count}×
          </strong>
        `;

        rankingList.appendChild(div);

      });

    }


    // =========================
    // URUCHOMIENIE
    // =========================

    checkDrawStatus();
    renderRanking();

    setInterval(checkDrawStatus, 1000);

  </script>

</body>
</html>
