<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRS – Losowanie Torów</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 92%;
    max-width: 700px;
    text-align: center;
    padding: 30px 15px 50px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.slot {
    background: #1b1b1b;
    border: 2px solid #333;
    border-radius: 18px;
    padding: 35px 20px;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}

#trackName {
    font-size: 30px;
    font-weight: bold;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.result {
    min-height: 45px;
    margin-top: 20px;
    font-size: 19px;
    font-weight: bold;
}

.stats {
    margin-top: 30px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 20px;
    text-align: left;
}

.stats h2 {
    text-align: center;
    margin-top: 0;
}

.trackStat {
    display: flex;
    justify-content: space-between;
    padding: 10px 5px;
    border-bottom: 1px solid #333;
}

.trackStat:last-child {
    border-bottom: none;
}

@media (max-width: 500px) {
    #trackName {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🏁 SRS LOSOWANIE TORU</h1>

    <div class="subtitle">
        SIM RACING SQUAD 🎲
    </div>

    <div class="slot">
        <div id="trackName">
            🎲 GOTOWY DO LOSOWANIA?
        </div>
    </div>

    <button id="drawButton">
        🎲 LOSUJ TOR
    </button>

    <div class="result" id="result"></div>

    <div class="stats">

        <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>

        <div id="ranking"></div>

    </div>

</div>

<script>

const tracks = [
    "Trial Mountain Circuit",
    "Deep Forest Raceway",
    "Dragon Trail – Seaside",
    "Red Bull Ring",
    "Suzuka Circuit",
    "Spa-Francorchamps",
    "Autodromo Nazionale Monza",
    "Mount Panorama",
    "Watkins Glen",
    "Nürburgring GP"
];

/* =====================
   SPRAWDZANIE UDZIAŁU
===================== */

const hasVoted =
    localStorage.getItem("srsAlreadyVoted") === "true";

/* =====================
   STATYSTYKI
===================== */

let stats = JSON.parse(
    localStorage.getItem("srsTrackStats")
) || {};

tracks.forEach(track => {

    if (stats[track] === undefined) {
        stats[track] = 0;
    }

});

function saveStats() {

    localStorage.setItem(
        "srsTrackStats",
        JSON.stringify(stats)
    );

}

function showRanking() {

    const ranking =
        document.getElementById("ranking");

    const sortedTracks =
        [...tracks].sort(
            (a, b) => stats[b] - stats[a]
        );

    ranking.innerHTML = "";

    sortedTracks.forEach(
        (track, index) => {

            let medal = "";

            if (index === 0) medal = "🥇";
            else if (index === 1) medal = "🥈";
            else if (index === 2) medal = "🥉";

            ranking.innerHTML += `
                <div class="trackStat">
                    <span>${medal} 🏁 ${track}</span>
                    <strong>${stats[track]}×</strong>
                </div>
            `;
        }
    );
}

/* =====================
   BLOKADA PO ODSWIEŻENIU
===================== */

function checkVoteStatus() {

    const button =
        document.getElementById("drawButton");

    const result =
        document.getElementById("result");

    if (hasVoted) {

        button.disabled = true;

        button.innerHTML =
            "✅ JUŻ WZIĄŁEŚ UDZIAŁ";

        result.innerHTML =
            "🏁 Możesz wziąć udział tylko raz.";

    }

}

/* =====================
   LOSOWANIE
===================== */

function drawTrack() {

    if (
        localStorage.getItem("srsAlreadyVoted") === "true"
    ) {
        return;
    }

    const button =
        document.getElementById("drawButton");

    const trackName =
        document.getElementById("trackName");

    const result =
        document.getElementById("result");

    button.disabled = true;

    result.innerHTML =
        "🎰 TRWA LOSOWANIE...";

    let counter = 0;

    let speed = 60;

    function spin() {

        const randomTrack =
            tracks[
                Math.floor(
                    Math.random() * tracks.length
                )
            ];

        trackName.innerHTML =
            "🏁 " + randomTrack;

        counter++;

        if (counter < 35) {

            speed += 10;

            setTimeout(
                spin,
                speed
            );

        } else {

            const winner =
                tracks[
                    Math.floor(
                        Math.random() * tracks.length
                    )
                ];

            trackName.innerHTML =
                "🏆 " + winner;

            result.innerHTML =
                "🎉 TWÓJ WYLOSOWANY TOR!";

            /* Zapis wyniku */

            stats[winner]++;

            saveStats();

            showRanking();

            /* BLOKADA UŻYTKOWNIKA */

            localStorage.setItem(
                "srsAlreadyVoted",
                "true"
            );

            button.innerHTML =
                "✅ JUŻ WZIĄŁEŚ UDZIAŁ";

            button.disabled = true;

        }

    }

    spin();

}

/* =====================
   START
===================== */

document
    .getElementById("drawButton")
    .addEventListener(
        "click",
        drawTrack
    );

showRanking();

checkVoteStatus();

</script>

</body>
</html>
